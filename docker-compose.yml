# Stack de desarrollo local. El de producción (imágenes desde ECR) es
# deploy/docker-compose.prod.yml.
name: energyshark

# master-1 y master-2 son la misma imagen con distinto puerto publicado (balanceo de
# carga con Nginx, parte variable de la E0). El alias de red "master" lo comparten ambas
# réplicas: el DNS de Docker reparte entre ellas las conexiones de connector a
# http://master:8000 (round-robin).
x-master-service: &master-service
  build: ./master
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    energyshark:
      aliases:
        - master
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - energyshark
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # "master" (alias de red) y "connector" son los nombres que exige la E0 (RNF2).
  master-1:
    <<: *master-service
    ports:
      - "127.0.0.1:8001:8000"

  master-2:
    <<: *master-service
    ports:
      - "127.0.0.1:8002:8000"

  connector:
    build: ./connector
    env_file: .env
    depends_on:
      master-1:
        condition: service_healthy
    networks:
      - energyshark
    restart: unless-stopped

  # --- Perfil "fake": broker y wallet locales (docker compose --profile fake up) ---
  # Sin este perfil no se levantan. Para que master y connector los usen, agregar
  # scripts/fake_wallet/env.fake al final de .env (ver scripts/fake_wallet/README.md).
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: ["fake"]
    volumes:
      - ./scripts/fake_wallet/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-energyshark.conf:ro
      - ./scripts/fake_wallet/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"  # consola de administración (admin/admin)
    networks:
      - energyshark
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

  fake-wallet:
    build: ./scripts/fake_wallet
    profiles: ["fake"]
    environment:
      # Publica los eventos como la central: user_id "central" en energy.x.
      FAKE_WALLET_AMQP_URL: amqp://central:local-central@rabbitmq:5672/energy
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - energyshark
    restart: unless-stopped

networks:
  energyshark:
    driver: bridge

volumes:
  postgres-data:
