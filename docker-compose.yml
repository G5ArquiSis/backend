# Stack de desarrollo local. El de producción (imágenes desde ECR) es
# deploy/docker-compose.prod.yml.
name: energyshark

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - energyshark
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # El nombre "master" lo exige la E0 (RNF2), igual que "connector".
  master:
    build: ./master
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - energyshark
    restart: unless-stopped

  connector:
    build: ./connector
    env_file: .env
    depends_on:
      master:
        condition: service_healthy
    networks:
      - energyshark
    restart: unless-stopped

networks:
  energyshark:
    driver: bridge

volumes:
  postgres-data:
