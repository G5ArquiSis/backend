# Tests en cada PR y push; deploy a producción en cada push a main (RNF04).
#
# Flujo del deploy: build de master y connector → push a ECR → SSM ordena a la EC2 hacer pull y
# levantar el stack. La EC2 nunca construye imágenes ni necesita acceso a GitHub.
# Configuración en AWS y variables del repo: docs/infraestructura.md.
name: CI / Deploy backend

on:
  push:
    branches: [main]
    # Un merge que solo toca documentación no cambia las imágenes: no vale un reinicio del stack.
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Rollback: SHA completo de un deploy anterior (sus imágenes deben seguir en ECR, que
          guarda las últimas 10). Vacío: deploy normal de main.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    # Un rollback vuelve a imágenes que ya pasaron los tests cuando se desplegaron.
    if: inputs.sha == ''
    runs-on: ubuntu-latest
    # Postgres real para que los tests de integración (JSONB, índice único de idpk,
    # TIMESTAMPTZ) corran en CI en vez de saltarse.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: energyshark
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: energyshark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energyshark -d energyshark_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://energyshark:changeme@localhost:5432/energyshark_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r master/requirements.txt -r connector/requirements.txt -r scripts/fake_wallet/requirements.txt pytest pytest-asyncio httpx ruff jsonschema rfc3339-validator
      - run: ruff check .
      # Contract tests (E4, RDOC04): los mensajes que arman connector y master se validan
      # contra los schemas del curso (fijos en v3.0.2) y contra los del grupo (main de
      # contratos: un cambio de contrato se mergea allá antes que su código). Con
      # CONTRACTS_REQUIRED=1 un clon faltante falla en vez de saltar los tests.
      - name: Clonar contratos (curso v3.0.2 y G5ArquiSis/contratos)
        run: |
          git clone --quiet --depth 1 --branch v3.0.2 \
            https://github.com/iic2173/energyshark-contracts.git "$RUNNER_TEMP/contratos-curso"
          git clone --quiet --depth 1 \
            https://github.com/G5ArquiSis/contratos.git "$RUNNER_TEMP/contratos-grupo"
          git -C "$RUNNER_TEMP/contratos-grupo" log -1 --format='contratos del grupo en %h: %s'
          {
            echo "ENERGYSHARK_CONTRACTS_DIR=$RUNNER_TEMP/contratos-curso"
            echo "GROUP_CONTRACTS_DIR=$RUNNER_TEMP/contratos-grupo"
            echo "CONTRACTS_REQUIRED=1"
          } >> "$GITHUB_ENV"
      - run: pytest
      # El OpenAPI de contratos se genera desde la app; si alguien cambia un router o un DTO
      # sin regenerarlo (o edita el YAML a mano), este paso falla con el diff.
      - name: OpenAPI de contratos al día con la app
        run: |
          python scripts/exportar_openapi.py "$RUNNER_TEMP/openapi.yaml"
          # fastapi y pydantic no están fijados, y según la versión el schema de un Decimal lleva
          # o no un `pattern`. Esa diferencia no cambia el contrato: se ignoran esas líneas.
          if ! diff -u -I '^ *pattern: ' "$RUNNER_TEMP/contratos-grupo/openapi/openapi.yaml" "$RUNNER_TEMP/openapi.yaml"; then
            echo "::error::contratos/openapi/openapi.yaml no coincide con la app. Regenerarlo con 'python scripts/exportar_openapi.py ../contratos/openapi/openapi.yaml' y mergearlo en contratos primero."
            exit 1
          fi
      - name: AGENTS.md referenciado desde el README
        run: grep -q "G5ArquiSis/contratos/blob/main/AGENTS.md" README.md || { echo "::error::README.md debe enlazar contratos/AGENTS.md"; exit 1; }
      # La imagen de master arranca bajo el agente de New Relic: se prueba acá, con una key
      # falsa, para que un entrypoint roto falle en el PR y no en el deploy a producción.
      - name: Smoke test de la imagen de master
        run: |
          docker build -t master-smoke ./master
          docker run -d --name master-smoke --network host \
            -e DATABASE_URL="$TEST_DATABASE_URL" \
            -e NEW_RELIC_LICENSE_KEY=0000000000000000000000000000000000000000 \
            -e NEW_RELIC_APP_NAME=ci-smoke \
            master-smoke
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs master-smoke
          exit 1

  deploy:
    needs: test
    # Sin las variables de AWS configuradas, el deploy se salta en vez de fallar.
    # always(): con un rollback el job de tests se salta, y sin always() este también.
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && vars.AWS_ROLE_ARN != ''
      && (needs.test.result == 'success' || (needs.test.result == 'skipped' && inputs.sha != ''))
    runs-on: ubuntu-latest
    # Dos deploys a la vez podrían dejar la EC2 con una mezcla de versiones.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC: GitHub obtiene credenciales temporales sin access keys guardadas
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      # En un rollback, el compose, la config de Nginx y el script de deploy son los de ese
      # commit, no los de main: tienen que calzar con sus imágenes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push a ECR (master y connector)
        if: inputs.sha == ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for service in master connector; do
            REPO="$REGISTRY/energyshark-$service"
            docker build -t "$REPO:$GITHUB_SHA" -t "$REPO:latest" "./$service"
            docker push "$REPO:$GITHUB_SHA"
            docker push "$REPO:latest"
          done
          echo "MASTER_IMAGE=$REGISTRY/energyshark-master:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "CONNECTOR_IMAGE=$REGISTRY/energyshark-connector:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Imágenes del commit al que se vuelve (rollback)
        if: inputs.sha != ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ inputs.sha }}
        run: |
          # Falla antes de tocar la EC2 si ECR ya no tiene las imágenes de ese commit.
          for service in master connector; do
            FOUND=$(aws ecr batch-get-image --repository-name "energyshark-$service" \
              --image-ids imageTag="$SHA" --query 'length(images)' --output text)
            if [ "$FOUND" != "1" ]; then
              echo "ECR no tiene energyshark-$service:$SHA (guarda las últimas 10 imágenes)"
              exit 1
            fi
          done
          echo "MASTER_IMAGE=$REGISTRY/energyshark-master:$SHA" >> "$GITHUB_ENV"
          echo "CONNECTOR_IMAGE=$REGISTRY/energyshark-connector:$SHA" >> "$GITHUB_ENV"

      - name: Deploy en EC2 vía SSM
        run: |
          # El compose, la config de Nginx y el script de deploy viajan dentro del comando
          # para que la EC2 siempre use los de este commit. deploy/remote-deploy.sh hace el
          # reinicio escalonado y vuelve solo a la versión anterior si la nueva no queda
          # healthy.
          jq -n \
            --arg compose_b64 "$(base64 -w0 deploy/docker-compose.prod.yml)" \
            --arg nginx_b64 "$(base64 -w0 deploy/nginx/energyshark-tls.conf)" \
            --arg script_b64 "$(base64 -w0 deploy/remote-deploy.sh)" \
            --arg master "$MASTER_IMAGE" \
            --arg connector "$CONNECTOR_IMAGE" \
            '{commands: [
              "set -eu",
              "cd /opt/energyshark",
              "echo \($compose_b64) | base64 -d > docker-compose.prod.yml.new",
              "echo \($nginx_b64) | base64 -d > energyshark-nginx.conf.new",
              "echo \($script_b64) | base64 -d > remote-deploy.sh",
              "bash remote-deploy.sh \($master) \($connector)"
            ]}' > commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${MASTER_IMAGE##*:}" \
            --parameters file://commands.json \
            --query Command.CommandId --output text)

          # Espera hasta ~12 minutos: un pull lento, el reinicio escalonado y, si la versión
          # nueva falla, el rollback (que vuelve a esperar a que todo quede healthy).
          for _ in $(seq 1 144); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Estado del deploy: $STATUS"
          test "$STATUS" = "Success"
