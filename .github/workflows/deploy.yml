# Tests en cada PR y push; deploy a producción en cada push a main (RNF04).
#
# Flujo del deploy: build de master y connector → push a ECR → SSM ordena a la EC2 hacer pull y
# levantar el stack. La EC2 nunca construye imágenes ni necesita acceso a GitHub.
# Configuración en AWS y variables del repo: docs/infraestructura.md.
name: CI / Deploy backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres real para que los tests de integración (JSONB, índice único de idpk,
    # TIMESTAMPTZ) corran en CI en vez de saltarse.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: energyshark
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: energyshark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energyshark -d energyshark_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://energyshark:changeme@localhost:5432/energyshark_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r master/requirements.txt -r connector/requirements.txt pytest pytest-asyncio httpx ruff
      - run: ruff check .
      - run: pytest
      # La imagen de master arranca bajo el agente de New Relic: se prueba acá, con una key
      # falsa, para que un entrypoint roto falle en el PR y no en el deploy a producción.
      - name: Smoke test de la imagen de master
        run: |
          docker build -t master-smoke ./master
          docker run -d --name master-smoke --network host \
            -e DATABASE_URL="$TEST_DATABASE_URL" \
            -e NEW_RELIC_LICENSE_KEY=0000000000000000000000000000000000000000 \
            -e NEW_RELIC_APP_NAME=ci-smoke \
            master-smoke
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs master-smoke
          exit 1

  deploy:
    needs: test
    # Sin las variables de AWS configuradas, el deploy se salta en vez de fallar.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # Dos deploys a la vez podrían dejar la EC2 con una mezcla de versiones.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC: GitHub obtiene credenciales temporales sin access keys guardadas
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push a ECR (master y connector)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for service in master connector; do
            REPO="$REGISTRY/energyshark-$service"
            docker build -t "$REPO:$GITHUB_SHA" -t "$REPO:latest" "./$service"
            docker push "$REPO:$GITHUB_SHA"
            docker push "$REPO:latest"
          done
          echo "MASTER_IMAGE=$REGISTRY/energyshark-master:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "CONNECTOR_IMAGE=$REGISTRY/energyshark-connector:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Deploy en EC2 vía SSM
        run: |
          # El compose y la config de Nginx viajan dentro del comando para que la EC2 siempre
          # use los de este commit.
          COMPOSE_B64=$(base64 -w0 deploy/docker-compose.prod.yml)
          NGINX_B64=$(base64 -w0 deploy/nginx/energyshark-tls.conf)
          COMPOSE="docker compose --env-file .env --env-file release.env -f docker-compose.prod.yml"
          SITE=/etc/nginx/sites-available/energyshark
          jq -n \
            --arg compose_b64 "$COMPOSE_B64" \
            --arg nginx_b64 "$NGINX_B64" \
            --arg site "$SITE" \
            --arg master "$MASTER_IMAGE" \
            --arg connector "$CONNECTOR_IMAGE" \
            --arg compose "$COMPOSE" \
            '{commands: [
              "set -eu",
              "cd /opt/energyshark",
              "test -f .env || { echo \"falta /opt/energyshark/.env\"; exit 1; }",
              "echo \($compose_b64) | base64 -d > docker-compose.prod.yml",
              "echo MASTER_IMAGE=\($master) > release.env",
              "echo CONNECTOR_IMAGE=\($connector) >> release.env",
              "\($compose) pull",
              "\($compose) up -d --remove-orphans --wait --wait-timeout 180",
              "echo \($nginx_b64) | base64 -d > /tmp/energyshark-nginx.conf",
              "if ! cmp -s /tmp/energyshark-nginx.conf \($site); then cp \($site) \($site).prev; cp /tmp/energyshark-nginx.conf \($site); if nginx -t; then systemctl reload nginx; echo \"nginx actualizado\"; else cp \($site).prev \($site); echo \"nginx -t fallo: config anterior restaurada\"; exit 1; fi; else echo \"nginx sin cambios\"; fi",
              "docker image prune -f"
            ]}' > commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://commands.json \
            --query Command.CommandId --output text)

          # Espera hasta ~5 minutos; el waiter de la CLI se rinde antes de que termine un pull lento.
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Estado del deploy: $STATUS"
          test "$STATUS" = "Success"
