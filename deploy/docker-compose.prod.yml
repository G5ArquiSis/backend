# Stack de producción en la EC2 (RNF04 E1). A diferencia del compose local:
# - usa imágenes de ECR (nunca `build:`); los tags los escribe el deploy en release.env;
# - limita memoria (t3.micro tiene 1 GB) y rota logs para no llenar el disco;
# - publica master solo en loopback: el tráfico externo entra por Nginx en el host.
#
# El workflow de deploy copia este archivo a /opt/energyshark en cada despliegue.
# Uso manual en la EC2:
#   docker compose --env-file .env --env-file release.env -f docker-compose.prod.yml up -d
name: energyshark-e1

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - energyshark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    mem_limit: 256m
    logging: *logging

  # Los nombres "master" y "connector" los exige la E0 (RNF2).
  master:
    image: ${MASTER_IMAGE:?MASTER_IMAGE no definida; la escribe el deploy en release.env}
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - energyshark
    restart: always
    mem_limit: 256m
    logging: *logging

  connector:
    image: ${CONNECTOR_IMAGE:?CONNECTOR_IMAGE no definida; la escribe el deploy en release.env}
    env_file: .env
    depends_on:
      master:
        condition: service_healthy
    networks:
      - energyshark
    restart: always
    mem_limit: 128m
    logging: *logging

networks:
  energyshark:
    driver: bridge

volumes:
  pgdata:
