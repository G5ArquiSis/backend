# Stack de producción en la EC2 (RNF04 E1). A diferencia del compose local:
# - usa imágenes de ECR (nunca `build:`); los tags los escribe el deploy en release.env;
# - limita memoria (t3.micro tiene 1 GB; presupuesto en docs/infraestructura.md § Memoria)
#   y rota logs para no llenar el disco;
# - publica las réplicas de master solo en loopback: el tráfico externo entra por Nginx
#   en el host, que las balancea (deploy/nginx/energyshark-tls.conf).
#
# Las variables de la E2 (MARKET_ENABLED, WALLET_*) llegan por env_file desde
# /opt/energyshark/.env, igual que las demás: no hay que listarlas acá.
#
# El workflow de deploy copia este archivo a /opt/energyshark en cada despliegue y
# deploy/remote-deploy.sh lo levanta (con rollback automático si algo no queda healthy).
# Uso manual en la EC2:
#   docker compose --env-file .env --env-file release.env -f docker-compose.prod.yml up -d
# No renombrar: el nombre del proyecto prefija el volumen de la base (energyshark-e1_pgdata).
# Con otro nombre, compose crearía una base vacía y dejaría la actual huérfana.
name: energyshark-e1

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# master-1 y master-2 son la misma imagen con distinto puerto publicado (balanceo de
# carga con Nginx, parte variable de la E0). El alias de red "master" lo comparten ambas
# réplicas: el DNS de Docker reparte entre ellas las conexiones de connector a
# http://master:8000 (round-robin).
x-master-service: &master-service
  image: ${MASTER_IMAGE:?MASTER_IMAGE no definida; la escribe el deploy en release.env}
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    energyshark:
      aliases:
        - master
  restart: always
  mem_limit: 256m
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - energyshark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    mem_limit: 256m
    logging: *logging

  # "master" (alias de red) y "connector" son los nombres que exige la E0 (RNF2).
  master-1:
    <<: *master-service
    ports:
      - "127.0.0.1:8001:8000"

  master-2:
    <<: *master-service
    ports:
      - "127.0.0.1:8002:8000"

  connector:
    image: ${CONNECTOR_IMAGE:?CONNECTOR_IMAGE no definida; la escribe el deploy en release.env}
    env_file: .env
    depends_on:
      master-1:
        condition: service_healthy
    networks:
      - energyshark
    restart: always
    mem_limit: 128m
    logging: *logging

networks:
  energyshark:
    driver: bridge

volumes:
  pgdata:
