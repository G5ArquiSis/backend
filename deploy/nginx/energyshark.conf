# EnergyShark — reverse proxy (RNF3 de la E0).
# Corre directamente sobre el host EC2, NO dentro de un container.
#
# Este es el archivo de BOOTSTRAP: solo HTTP, válido antes de que exista un
# certificado. Una vez emitido, reemplazar por energyshark-tls.conf.
#
#   sudo cp deploy/nginx/energyshark.conf /etc/nginx/sites-available/energyshark
#   sudo ln -sf /etc/nginx/sites-available/energyshark /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# master publicado por docker compose en loopback (deploy/docker-compose.prod.yml).
# Para escalar horizontalmente: agregar réplicas en el compose y servidores acá.
upstream energyshark_master {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name melchort.me www.melchort.me;

    # Certbot valida el dominio por acá y debe seguir accesible por HTTP plano
    # incluso después de activar el redirect a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://energyshark_master;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
