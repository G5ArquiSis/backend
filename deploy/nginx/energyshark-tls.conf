# EnergyShark — configuración final, con HTTPS.
#
# Reemplaza a energyshark.conf DESPUÉS de emitir el certificado:
#   sudo certbot --nginx -d melchort.me -d www.melchort.me
#   sudo cp deploy/nginx/energyshark-tls.conf /etc/nginx/sites-available/energyshark
#   sudo nginx -t && sudo systemctl reload nginx
#
# `nginx -t` falla sobre este archivo si el certificado todavía no existe: eso es
# esperable, no un error de configuración.

# master publicado por docker compose en loopback (deploy/docker-compose.prod.yml).
# Para escalar horizontalmente: agregar réplicas en el compose y servidores acá.
upstream energyshark_master {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name melchort.me www.melchort.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name melchort.me www.melchort.me;

    ssl_certificate     /etc/letsencrypt/live/melchort.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melchort.me/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://energyshark_master;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
