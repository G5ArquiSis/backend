# EnergyShark — configuración final: HTTPS y balanceo de carga (partes variables de la E0).
#
# Reemplaza a energyshark.conf DESPUÉS de emitir el certificado:
#   sudo certbot --nginx -d melchort.me -d www.melchort.me
#   sudo cp deploy/nginx/energyshark-tls.conf /etc/nginx/sites-available/energyshark
#   sudo nginx -t && sudo systemctl reload nginx
#
# `nginx -t` falla sobre este archivo si el certificado todavía no existe: eso es
# esperable, no un error de configuración.

# Las dos réplicas de master que docker compose publica en loopback
# (deploy/docker-compose.prod.yml). Agregar o quitar servidores acá, junto con sus
# réplicas en el compose, es lo único que hace falta para escalar horizontalmente.
upstream energyshark_master {
    least_conn;
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
}

server {
    listen 80;
    listen [::]:80;
    server_name melchort.me www.melchort.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name melchort.me www.melchort.me;

    ssl_certificate     /etc/letsencrypt/live/melchort.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melchort.me/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Valen para todas las locations de abajo: ninguna declara los suyos.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Define $gateway_secret. El archivo vive solo en el host, fuera del repo
    # (docs/infraestructura.md): si falta, `nginx -t` falla y el deploy no lo instala.
    include /etc/nginx/energyshark-gateway-secret.conf;

    # Rutas de la E0: públicas, como exige esa entrega.
    location / {
        proxy_pass http://energyshark_master;
    }

    # Endpoints que solo usa connector, por la red de Docker. Desde afuera no existen.
    location /internal/ {
        return 404;
    }

    # Rutas de la E1: entran únicamente por API Gateway, que ya validó el token de
    # Auth0 (RNF02) y agrega este header. Sin él, llamar directo a melchort.me se
    # saltaría la autenticación.
    location ~ ^/(negotiations|cycles|connectivity|message-log)(/|$) {
        if ($http_x_gateway_secret != $gateway_secret) {
            return 403;
        }
        proxy_pass http://energyshark_master;
    }
}
